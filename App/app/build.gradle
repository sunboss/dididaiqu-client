plugins {
    id 'com.android.application'
}

android {
    // Namespace (required for AGP 8.0+)
    namespace 'com.sunboss.dididaiqu'
    compileSdk 34

    defaultConfig {
        applicationId "com.sunboss.dididaiqu"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // 纯 framework 实现，无第三方依赖
}
